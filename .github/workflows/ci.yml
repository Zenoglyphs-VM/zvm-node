name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Linux, as most people who build this will be on.
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  contract-behavior:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            contracts/test/package-lock.json
            contracts/test/market-runtime/zvm-nft/package-lock.json
            contracts/test/market-runtime/zvm-karum/package-lock.json
      - name: Install the locked EVM test toolchain
        run: npm ci --ignore-scripts --prefix contracts/test
      - name: Install each exact frontend SDK closure
        run: |
          npm ci --ignore-scripts --prefix contracts/test/market-runtime/zvm-nft
          npm ci --ignore-scripts --prefix contracts/test/market-runtime/zvm-karum
      - name: Acquire bounded pinned interface sources
        run: node contracts/test/fetch-market-inputs.mjs
      - name: Acquire bounded pinned compiler inputs
        run: node contracts/test/fetch-inputs.mjs
      - name: Exercise freshly compiled contract behavior
        run: npm test --prefix contracts/test
      - name: Refuse tracked artifact drift
        run: git diff --exit-code

  upstream-predeploy-build-tools:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: node --test --test-reporter=tap contracts/build-support.test.cjs contracts/upstream-predeploy-build.test.cjs
